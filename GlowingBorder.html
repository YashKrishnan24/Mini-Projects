<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Glowing Border</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #09090b; 
            color: #ffffff;
        }

        .glow-wrapper {
            position: relative;
            width: 320px;
            height: 420px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.1);
            transition: box-shadow 0.5s ease, transform 0.5s ease;
        }

        .glow-wrapper:hover {
            transform: translateY(-5px);
            box-shadow: 0 0 40px rgba(0, 255, 255, 0.4), 0 0 80px rgba(255, 0, 255, 0.2);
        }

        .glow-wrapper::before {
            content: "";
            position: absolute;
            width: 150%;
            height: 150%;
            background: conic-gradient(
                transparent, 
                transparent, 
                transparent, 
                #00ffff, 
                #ff00ff, 
                transparent 30%
            );
            animation: rotate-gradient 4s linear infinite;
        }

        @keyframes rotate-gradient {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .card-inner {
            position: absolute;
            inset: 3px; 
            background-color: #121214;
            border-radius: 17px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            padding: 40px 30px;
        }

        .tag {
            align-self: flex-start;
            background: rgba(0, 255, 255, 0.1);
            color: #00ffff;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 20px;
        }

        .title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 15px;
            line-height: 1.2;
            background: linear-gradient(to right, #ffffff, #a1a1aa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .description {
            color: #a1a1aa;
            font-size: 15px;
            line-height: 1.6;
            flex-grow: 1;
        }

        .cta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .price {
            font-size: 24px;
            font-weight: 600;
        }

        .icon-btn {
            background: #ffffff;
            color: #000000;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            font-size: 20px;
            font-weight: bold;
            transition: transform 0.3s ease;
        }

        .icon-btn:hover {
            transform: scale(1.1) rotate(15deg);
        }
    </style>
</head>
<body>
    <div class="glow-wrapper">
        <div class="card-inner">
            <span class="tag">Premium</span>
            <h1 class="title">Next-Gen Analytics</h1>
            <p class="description">
                Unlock real-time data processing with our cutting-edge AI engine. 
                Experience seamless integration and unparalleled speed.
            </p>
            
            <div class="cta">
                <span class="price">$49<span style="font-size: 14px; color: #a1a1aa;">/mo</span></span>
                <a href="#" class="icon-btn">→</a>
            </div>
        </div>
    </div>
</body>
</html>
