<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glassmorphism Newsletter UI</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Standalone styles for the Newsletter Card */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #1f1c2c 0%, #928dab 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        .background-shapes {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }

        .shape {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
        }

        .shape.one {
            width: 250px;
            height: 250px;
            background: #ff512f;
            top: 10%;
            left: 25%;
        }

        .shape.two {
            width: 200px;
            height: 200px;
            background: #dd2476;
            bottom: 15%;
            right: 25%;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 40px;
            width: 90%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            color: #ffffff;
        }

        .glass-card h2 {
            margin: 0 0 10px;
            font-size: 28px;
            font-weight: 600;
        }

        .glass-card p {
            margin: 0 0 30px;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.8);
            line-height: 1.5;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .input-group input {
            width: 100%;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 12px 15px;
            border-radius: 10px;
            color: #fff;
            font-size: 15px;
            outline: none;
            box-sizing: border-box;
            transition: border 0.3s ease;
        }

        .input-group input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .input-group input:focus {
            border: 1px solid rgba(255, 255, 255, 0.5);
            background: rgba(255, 255, 255, 0.15);
        }

        .submit-btn {
            background: linear-gradient(135deg, #ff512f 0%, #dd2476 100%);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(221, 36, 118, 0.4);
        }

        /* Responsive styling */
        @media (min-width: 600px) {
            .input-group {
                flex-direction: row;
            }
            .input-group input {
                flex: 1;
            }
            .submit-btn {
                width: auto;
                padding: 12px 25px;
            }
        }
    </style>
</head>
<body>

    <div class="background-shapes">
        <div class="shape one"></div>
        <div class="shape two"></div>
    </div>

    <div class="glass-card">
        <h2>Stay Updated</h2>
        <p>Subscribe to our newsletter to receive the latest updates, tips, and UI/UX design trends straight to your inbox.</p>
        
        <form onsubmit="event.preventDefault(); alert('Subscribed Successfully!');">
            <div class="input-group">
                <input type="email" placeholder="Enter your email address" required>
                <button type="submit" class="submit-btn">Subscribe</button>
            </div>
        </form>
    </div>

</body>
</html>
